<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="420" viewBox="0 0 1460 420" role="img" aria-labelledby="title desc">
  <title id="title">Team 3 software flow</title>
  <desc id="desc">Flusso software Team 3 con server PC, protocollo TCP e firmware Arduino rover.</desc>
  <rect width="1460" height="420" fill="#f8fafc"/>

