  <rect x="20" y="132" rx="14" ry="14" width="180" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="110" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">DJI Fly</text>
  <text x="110" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">stream app</text>

