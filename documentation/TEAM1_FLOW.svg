  <text x="345" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">ADB + scrcpy</text>
  <text x="345" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">video bridge</text>

