  <text x="575" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">detector/capture.py</text>

  <rect x="710" y="132" rx="14" ry="14" width="230" height="120" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="825" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">server decisione</text>
  <text x="825" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">server/server.py</text>
  <text x="825" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">ArUco + solvePnP + HUD</text>

