  <polygon points="250,192 236,184 236,200" fill="#334155"/>
  <line x1="440" y1="192" x2="470" y2="192" stroke="#334155" stroke-width="4"/>
  <polygon points="470,192 456,184 456,200" fill="#334155"/>
  <line x1="680" y1="192" x2="710" y2="192" stroke="#334155" stroke-width="4"/>
  <polygon points="710,192 696,184 696,200" fill="#334155"/>
  <line x1="940" y1="192" x2="970" y2="192" stroke="#334155" stroke-width="4"/>
  <polygon points="970,192 956,184 956,200" fill="#334155"/>
  <line x1="1160" y1="192" x2="1190" y2="192" stroke="#334155" stroke-width="4"/>
  <polygon points="1190,192 1176,184 1176,200" fill="#334155"/>

  <text x="345" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">frame stream</text>
