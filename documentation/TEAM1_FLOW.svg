  <text x="1065" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">team1/robomaster_api.py</text>

  <rect x="1190" y="132" rx="14" ry="14" width="150" height="120" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="1265" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">DJI SDK</text>
  <text x="1265" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">drive_speed</text>

