<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="420" viewBox="0 0 1360 420" role="img" aria-labelledby="title desc">
  <title id="title">Team 1 software flow</title>
  <desc id="desc">Flusso software Team 1 con logica completa su server e controllo diretto RoboMaster via SDK.</desc>
  <rect width="1360" height="420" fill="#f8fafc"/>

  <text x="36" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">TEAM 1 - FLUSSO SOFTWARE</text>

  <rect x="30" y="132" rx="14" ry="14" width="190" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="125" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">DJI Fly</text>
  <text x="125" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">stream app</text>

